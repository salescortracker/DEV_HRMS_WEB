<div class="card shadow-sm">
  <div class="container-fluid p-4 priority-master">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-semibold mb-0">
        <i class="fa-solid fa-building-columns me-2 text-danger"></i>
        Account Type Management
      </h4>
    </div>

    <hr class="mb-4" />

    <!-- Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form (ngSubmit)="onSubmit()" #accountForm="ngForm">

          <div class="row g-3">



            <!-- Company -->
             <div class="col-md-6">
              <label class="form-label fw-semibold">Company *</label>
              <select class="form-select" name="company" [(ngModel)]="account.companyId" (change)="onCompanyChange()"
                required>

                <option [ngValue]="0">-- Select Company --</option>
                <option *ngFor="let c of companies" [ngValue]="c.companyId">
                  {{ c.companyName }}
                </option>
              </select>
            </div>

            <!-- Region -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Region *</label>
              <select class="form-select" name="region" [(ngModel)]="account.regionId" required>

                <option [ngValue]="0">-- Select Region --</option>
                <option *ngFor="let r of regions" [ngValue]="r.regionID">
                  {{ r.regionName }}
                </option>
              </select>
            </div>

            <!-- Account Type -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Account Type</label>
              <input type="text" class="form-control" name="accountType1" [(ngModel)]="account.accountType1"
                placeholder="Enter Account Type" required />
            </div>

            <!-- Description -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Description </label>
              <input type="text" class="form-control" [(ngModel)]="account.description" name="description">
            </div>

            <!-- Status -->
            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check form-switch mt-3">
                <input class="form-check-input" type="checkbox" [(ngModel)]="account.isActive" name="isActive">
                <label class="ms-2">
                  {{ account.isActive ? 'Is Active' : 'Inactive' }}
                </label>
              </div>
            </div>

            <!-- Buttons -->
            <div class="col-md-6 d-flex gap-2">
              <button class="btn btn-danger w-100" type="button" (click)="resetForm()">
                Cancel
              </button>

              <button class="btn btn-dark w-100" type="submit">
                {{ isEditMode ? 'Update' : 'Save' }}
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>

    <!-- TABLE -->
     <div class="card shadow-sm mb-4">
    <div class="table-responsive">

    <div class="mb-3 d-flex justify-content-end">
      <input
        type="text"
        class="form-control"
        style="width:250px"
        placeholder="Search Account Type"
        [(ngModel)]="searchText"
        name="searchText">
    </div>
  
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>#</th>
            <th>Account Type</th>
            <th>Description</th>
            <th>Company</th>
            <th>Region</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let a of filteredAccountTypes; let i=index">
            <td>{{ i+1 }}</td>
            <td>{{ a.accountType1 }}</td>
            <td>{{ a.description }}</td>
            <td>{{ getCompanyName(a.companyId || a.CompanyId) }}</td>
            <td>{{ getRegionName(a.regionId || a.RegionId) }}</td>

            <td>
              <span class="badge" [ngClass]="a.isActive ? 'bg-success':'bg-secondary'">
                {{ a.isActive ? 'Active':'Inactive' }}
              </span>
            </td>

            <td>
              <button class="btn btn-sm btn-outline-primary me-2" (click)="editAccount(a)">
                <i class="fa-solid fa-pen-to-square"></i>
              </button>

              <button class="btn btn-sm btn-outline-danger" (click)="deleteAccount(a)">
                <i class="fa-solid fa-trash"></i>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
</div>
  </div>
</div>
