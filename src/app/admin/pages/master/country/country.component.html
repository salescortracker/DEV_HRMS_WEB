<div class="card shadow-sm">
  <div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 class="fw-semibold mb-0">
        <i class="fa-solid fa-earth-americas me-2 text-primary"></i>
        Country Master
      </h4>
    </div>

    <hr />

    <!-- FORM -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">

        <form #countryForm="ngForm" (ngSubmit)="onSubmit()">

          <div class="row g-3">

            <!-- COUNTRY -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">
                Country Name *
              </label>

              <input
                type="text"
                class="form-control"
                name="CountryName"
                [(ngModel)]="country.countryName"
                required>
            </div>

            <!-- COMPANY -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">
                Company *
              </label>

              <select
                class="form-select"
                name="CompanyId"
                [(ngModel)]="country.companyId"
                (change)="onCompanyChange()"
                required>

                <option [ngValue]="0">
                  -- Select Company --
                </option>

                <option
                  *ngFor="let c of companies"
                  [ngValue]="c.companyId">

                  {{ c.companyName }}
                </option>
              </select>
            </div>

            <!-- REGION -->
            <div class="col-md-4">
              <label class="form-label fw-semibold">
                Region *
              </label>

              <select
                class="form-select"
                name="RegionId"
                [(ngModel)]="country.regionId"
                required>

                <option [ngValue]="0">
                  -- Select Region --
                </option>

                <option
                  *ngFor="let r of regions"
                  [ngValue]="r.regionID">

                  {{ r.regionName }}
                </option>
              </select>
            </div>

            <!-- ACTIVE -->
            <div class="col-md-2 d-flex align-items-center mt-4">
              <label class="me-2 fw-semibold">
                Is Active
              </label>

              <div class="form-check form-switch">
                <input
                  class="form-check-input"
                  type="checkbox"
                  name="IsActive"
                  [(ngModel)]="country.isActive">
              </div>
            </div>

            <!-- BUTTONS -->
            <div class="col-md-10 mt-4 text-end">

              <button
                class="btn btn-success me-2"
                type="submit"
                [disabled]="!countryForm.valid">

                {{ isEditMode ? 'Update' : 'Save' }}
              </button>

              <button
                class="btn btn-secondary"
                type="button"
                (click)="resetForm()">

                Reset
              </button>

            </div>

          </div>

        </form>

      </div>
    </div>

    <!-- TABLE -->
    <div class="card shadow-sm">
      <div class="card-body">

        <div class="mb-3 d-flex justify-content-end">
          <input
            class="form-control w-25"
            placeholder="Search Country"
            [(ngModel)]="searchText">
        </div>

        <table class="table table-bordered table-hover align-middle">

          <thead class="table-light">
            <tr>
              <th>S.No</th>
              <th>Country</th>
              <th>Company</th>
              <th>Region</th>
              <th class="text-center">Active</th>
              <th class="text-center">Actions</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let c of pagedCountries; let i = index">

              <td>
                {{ (currentPage - 1) * pageSize + i + 1 }}
              </td>

              <td>{{ c.countryName }}</td>

              <td>
                {{ companyMap[c.companyId] || '—' }}
              </td>

              <td>
                {{ regionMap[c.regionId] || '—' }}
              </td>

              <td class="text-center">
                <i
                  class="fa-solid"
                  [ngClass]="c.isActive
                    ? 'fa-circle-check text-success'
                    : 'fa-circle-xmark text-danger'">
                </i>
              </td>

              <td class="text-center">

                <button
                  class="btn btn-sm btn-outline-primary me-2"
                  (click)="editCountry(c)">

                  <i class="fa-solid fa-pen-to-square"></i>
                </button>

                <button
                  class="btn btn-sm btn-outline-danger"
                  (click)="deleteCountry(c)">

                  <i class="fa-solid fa-trash"></i>
                </button>

              </td>

            </tr>

            <tr *ngIf="filteredCountries().length === 0">
              <td colspan="6" class="text-center text-muted">
                No records found
              </td>
            </tr>

          </tbody>

        </table>

      </div>
    </div>

  </div>
</div>
