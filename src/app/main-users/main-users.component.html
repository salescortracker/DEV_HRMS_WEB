<div class="card shadow-sm">
  <div class="container-fluid p-4 user-management">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
     <h4 class="fw-semibold mb-0 text-dark">
  <i class="fa-solid fa-user-gear me-2 text-danger"></i>
  User Management
</h4>
      <!-- <button class="btn btn-danger" (click)="resetForm()">
        <i class="fa-solid fa-plus me-2"></i> Add New User
      </button> -->
    </div>

    <hr />

    <!-- User Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form (ngSubmit)="onSubmit()" #userForm="ngForm" novalidate>
          <div class="row g-3">

            <!-- Company -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Company <span class="text-danger">*</span></label>
              <select class="form-select" name="CompanyID" [(ngModel)]="user.companyId" (ngModelChange)="onCompanyChange($event)" required>
                <option value="">Select Company</option>
                <option *ngFor="let c of companies" [ngValue]="c.companyId">{{ c.companyName }}</option>
              </select>
            </div>

            <!-- Region -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Region <span class="text-danger">*</span></label>
               <select class="form-select" name="RegionID" [(ngModel)]="user.regionId" (change)="onRegionChange(user.regionId)" required>
                <option value="">Select Region</option>
                  <option *ngFor="let r of filteredRegions" [ngValue]="r.regionID">{{ r.regionName }}</option>
              </select>
            </div>

            <!-- Employee Code -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Employee Code <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="EmployeeCode"
                     [(ngModel)]="user.employeeCode" required placeholder="Enter employee code" disabled />
            </div>

            <!-- Full Name -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" name="FullName"
                     [(ngModel)]="user.fullName" required placeholder="Enter full name" />
            </div>

            <!-- Email -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
              <input type="email" class="form-control" name="Email"
                     [(ngModel)]="user.email" required placeholder="Enter email address" />
            </div>

            <!-- Role -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
              <select class="form-select" name="Role" [(ngModel)]="user.roleId" [disabled]="!user.regionId" required>
                <option value="">Select Role</option>
                 <option *ngFor="let r of roles" [ngValue]="r.roleId">
    {{ r.roleName }}
  </option>
              </select>
            </div>

            <!-- Password -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <input type="text" class="form-control" [(ngModel)]="user.password"
                       name="Password" placeholder="Auto-generated or enter manually" />
                <button class="btn btn-outline-secondary" type="button" (click)="generateFormPassword()">
                  Generate
                </button>
              </div>
            </div>
     <!-- Department -->
  <!-- Department -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Department <span class="text-danger">*</span>
  </label>

  <select class="form-select"
          name="DepartmentId"
          [(ngModel)]="user.departmentId"
          (ngModelChange)="onDepartmentChange($event)"
          [disabled]="!user.regionId"
          required>

    <option [ngValue]="0">Select Department</option>

    <option *ngFor="let d of filteredDepartments"
            [ngValue]="d.departmentId">
      {{ d.departmentName }}
    </option>

  </select>
</div>

<!-- Designation -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Designation <span class="text-danger">*</span>
  </label>

  <select class="form-select"
          name="DesignationId"
          [(ngModel)]="user.designationId"
          [disabled]="!user.departmentId"
          required>

    <option [ngValue]="0">Select Designation</option>

    <option *ngFor="let d of filteredDesignations"
            [ngValue]="d.designationID">
      {{ d.designationName }}
    </option>

  </select>
</div>

<!-- Reporting To -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Reporting To <span class="text-danger">*</span>
  </label>

  <select class="form-select"
          [(ngModel)]="user.reportingTo"
          name="reportingTo"
          required>

    <option [ngValue]="0">Select Reporting Manager</option>

    <option *ngFor="let emp of reportingToUsers"
            [ngValue]="emp.userId">
      {{ emp.fullName }} ({{ emp.employeeCode }})
    </option>

  </select>
</div>

<!-- Reporting HR -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Reporting HR <span class="text-danger">*</span>
  </label>

  <select class="form-select"
          name="reportingHr"
          [(ngModel)]="user.reportingHr"
          required>

    <option [ngValue]="0">Select HR</option>

    <option *ngFor="let hr of filteredHrUsers"
            [ngValue]="hr.userId">
      {{ hr.fullName }} ({{ hr.designationName }})
    </option>

  </select>
</div>

<!-- Joining Date -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Joining Date <span class="text-danger">*</span>
  </label>

  <input type="date"
         class="form-control"
         name="joiningDate"
         [(ngModel)]="user.joiningDate"
         required />
</div>

<!-- Login Type -->
<div class="col-md-6">
  <label class="form-label fw-semibold">
    Login Type <span class="text-danger">*</span>
  </label>

  <select class="form-select"
          name="loginType"
          [(ngModel)]="user.loginType"
          required>

    <option value="">Select Login Type</option>
    <option value="Admin">Admin</option>
    <option value="User">User</option>

  </select>
</div>

            <!-- Status -->
            <div class="col-md-6 d-flex align-items-center">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="statusSwitch"
                       [checked]="user.status === 'Active'"
                       (change)="onStatusChange($event)" />
                <label class="form-check-label" for="statusSwitch">
                  {{ user.status === 'Active' ? 'Active' : 'Inactive' }}
                </label>
              </div>
            </div>
       
            <!-- Submit Button -->
           <div class="col-md-12 text-end mt-3">
  <button type="submit"
          class="btn btn-dark px-4"
          [disabled]="!userForm.valid">

    <i class="fa-solid fa-save me-2"></i>
    Create Employee

  </button>
</div>

          </div>
        </form>
      </div>
    </div>

  </div>
</div>
