    <!-- Tabs header -->
    <div class="card mb-3">
      <div class="card-body p-2">
        <div class="d-flex">
           <button *ngIf="canViewApplicationResumes" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 7"
            [class.btn-outline-primary]="activeTab !== 7" (click)="setActiveTab(7)">
            Application Resumes
          </button>
          <button *ngIf="canViewResume" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 1"
            [class.btn-outline-primary]="activeTab !== 1" (click)="setActiveTab(1)">
            Resume Upload
          </button>

          <button *ngIf="canViewScreening" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 2"
            [class.btn-outline-primary]="activeTab !== 2" (click)="setActiveTab(2)">
            Screening
          </button>

          <button *ngIf="canViewInterviews" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 3"
            [class.btn-outline-primary]="activeTab !== 3" (click)="setActiveTab(3)">
            Interview
          </button>

          <button *ngIf="canViewAppointment" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 4"
            [class.btn-outline-primary]="activeTab !== 4" (click)="setActiveTab(4)">
            Appointment
          </button>

          <button *ngIf="canViewOffer" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 5"
            [class.btn-outline-primary]="activeTab !== 5" (click)="setActiveTab(5)">
            Offer
          </button>

          <button *ngIf="canViewOnboarding" class="btn flex-fill me-1" [class.btn-primary]="activeTab === 6"
            [class.btn-outline-primary]="activeTab !== 6" (click)="setActiveTab(6)">
            Onboarding
          </button>
         
          <!-- class="btn flex-fill me-1"
          [class.btn-primary]="activeTab === i+1"
          [class.btn-outline-primary]="activeTab !== i+1"
          (click)="setActiveTab(i+1)">
          {{ t }} -->

        </div>
      </div>
    </div>

    <!-- main content area -->
    <div class="card">
      <div class="card-body">
         <div *ngIf="activeTab === 7 && canViewApplicationResumes">
          <app-application-resumes></app-application-resumes>
        </div>


        <!-- TAB 1: Resume Upload / Candidate Intake -->
        <div *ngIf="activeTab === 1 && canViewResume">
          <app-resume-upload></app-resume-upload>
        </div>

        <!-- TAB 2: Screening / Shortlisting -->
        <div *ngIf="activeTab === 2 && canViewScreening">
          <app-screening></app-screening>
        </div>

        <!-- TAB 3: Interview Process (dynamic rounds) -->
        <div *ngIf="activeTab === 3 && canViewInterviews">
          <app-interview></app-interview>
        </div>

        <!-- TAB 4: Offer Management -->
        <div *ngIf="activeTab === 4 && canViewAppointment">
          <app-appointment></app-appointment>
        </div>

        <!-- TAB 5: Onboarding -->
        <div *ngIf="activeTab === 5 && canViewOffer">
          <app-offer></app-offer>
        </div>

        <div *ngIf="activeTab === 6 && canViewOnboarding">
          <app-onboarding></app-onboarding>

        </div>
       
      </div>
    </div>
  </div>
</div>
<app-footer></app-footer>
