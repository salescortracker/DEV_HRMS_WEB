<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Leave Management</h2>
  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Leave</a> &gt;
    <span>Leave Management</span>
  </nav>
</div>

<div class="tab-container mt-4">

  <div class="tab-header">

    <button
      *ngIf="canApplyLeave"
      type="button"
      class="tab-label"
      routerLink="/leave-management/apply-leave"
      routerLinkActive="active">
      Apply Leave
    </button>

    <button
      *ngIf="canViewApproval"
      type="button"
      class="tab-label"
      routerLink="/leave-management/leave-approvals"
      routerLinkActive="active">
      Leave Approvals
    </button>

    <button
      *ngIf="canViewCalendar"
      type="button"
      class="tab-label"
      routerLink="/leave-management/leave-calendar"
      routerLinkActive="active">
      Leave Calendar
    </button>

    <button
      *ngIf="canViewReport"
      type="button"
      class="tab-label"
      routerLink="/leave-management/leave-report"
      routerLinkActive="active">
      Leave Report
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
