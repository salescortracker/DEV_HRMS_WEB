
    <h5 class="mt-3">KPI Approval Reports</h5>

    <div class="table-responsive mt-3">

      <table class="table table-bordered table-striped">

        <thead class="table-light">
          <tr>
            <th>Employee Name</th>
            <th>Department</th>
            <th>Project</th>
            <th>Year</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>

         <tr *ngFor="let item of performanceReports">
<td>{{item.employeeName}}</td>
<td>{{item.department}}</td>
<td>{{item.departmentProject}}</td>
<td>{{item.appraisalYear}}</td>

  <td>
    <span class="badge" [ngClass]="{
      'bg-success': item.status === 'Approved',
      'bg-danger': item.status === 'Rejected',
      'bg-warning': item.status === 'Submitted'
    }">

      {{item.status}}

    </span>
  </td>

</tr>

          <tr *ngIf="performanceReports.length === 0">
            <td colspan="6" class="text-center">
              No Records Found
            </td>
          </tr>

        </tbody>

      </table>

    </div>
