<app-header></app-header>
<app-sidebar></app-sidebar>

<!-- PAGE HEADER -->
<div class="dashboard-header">
  <h2 class="dashboard-title">Performance & KPI Review</h2>

  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Performance</a> &gt;
    <span>KPI Submission</span>
  </nav>
</div>

<div class="tab-container mt-4">

  <div class="tab-header">

    <button
      *ngIf="canViewEmployeeSubmission"
      type="button"
      class="tab-label"
      routerLink="/kpi-performance/employee-submission"
      routerLinkActive="active">
      Employee Submission
    </button>

    <button
      *ngIf="canViewManagerReviewApproval"
      type="button"
      class="tab-label"
      routerLink="/kpi-performance/manager-review"
      routerLinkActive="active">
      Manager Review & Approval
    </button>

    <button
      *ngIf="canViewManagerkpiapproval"
      type="button"
      class="tab-label"
      routerLink="/kpi-performance/performance-reports"
      routerLinkActive="active">
      KPI Approval
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
