<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">My Tasks</h2>
  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">My Tasks</a> &gt;
    <span>Task Management</span>
  </nav>
</div>

<div class="tab-container">

  <div class="tab-header">

    <button
      *ngIf="canViewMyTask"
      type="button"
      class="tab-label"
      routerLink="/my-task/my-tasks"
      routerLinkActive="active">
      My Task
    </button>

    <button
      *ngIf="canViewTeamTask"
      type="button"
      class="tab-label"
      routerLink="/my-task/team-task"
      routerLinkActive="active">
      Team Task
    </button>

    <button
      *ngIf="canViewTaskReport"
      type="button"
      class="tab-label"
      routerLink="/my-task/task-report"
      routerLinkActive="active">
      Task Report
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
