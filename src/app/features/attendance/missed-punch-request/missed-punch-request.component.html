<app-header></app-header>
<app-sidebar></app-sidebar>

<!-- PAGE HEADER -->
<div class="dashboard-header">
  <h2 class="dashboard-title">Missed Punch Requests</h2>

  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Attendance</a> &gt;
    <span>Missed Punch Requests</span>
  </nav>
</div>

<div class="tab-container mt-4">

  <div class="tab-header">

    <button
      *ngIf="canViewPersonal"
      type="button"
      class="tab-label"
      routerLink="/missed-punch-request/my-request"
      routerLinkActive="active">
      My Requests
    </button>

    <button
      *ngIf="canViewManager"
      type="button"
      class="tab-label"
      routerLink="/missed-punch-request/manager-approval"
      routerLinkActive="active">
      Manager Approval
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
