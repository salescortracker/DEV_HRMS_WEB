<app-header></app-header>
<app-sidebar></app-sidebar>

<!-- Page Header -->
<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Documents</h2>

  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Employee Profile</a> &gt;
    <span>Employee Documents</span>
  </nav>
</div>

<!-- Document Tabs -->
<div class="tab-container">

  <div class="tab-header">

    <button
      *ngIf="canViewLetters"
      type="button"
      class="tab-label"
      routerLink="/documents/letters"
      routerLinkActive="active">
      Letters
    </button>

    <button
      *ngIf="canViewForms"
      type="button"
      class="tab-label"
      routerLink="/documents/forms"
      routerLinkActive="active">
      Forms
    </button>

    <button
      *ngIf="canViewDocuments"
      type="button"
      class="tab-label"
      routerLink="/documents/my-documents"
      routerLinkActive="active">
      My Documents
    </button>

    <button
      *ngIf="canViewMyLetters"
      type="button"
      class="tab-label"
      routerLink="/documents/my-letters"
      routerLinkActive="active">
      My Letters
    </button>

    <button
      *ngIf="canViewMyForms"
      type="button"
      class="tab-label"
      routerLink="/documents/my-forms"
      routerLinkActive="active">
      My Forms
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
