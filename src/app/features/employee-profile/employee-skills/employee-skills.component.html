<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Skills</h2>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Home</a> &gt;
    <span>Employee Skills</span>
  </nav>
</div>

<div class="tab-container">

  <!-- Tab Header -->
  <div class="tab-header">

    <button
      *ngIf="canJobHistory"
      type="button"
      class="tab-label"
      routerLinkActive="active"
      [routerLink]="['/skills/job-history']">
      Job History
    </button>
<button
      *ngIf="canCertification"
      type="button"
      class="tab-label"
      routerLinkActive="active"
      [routerLink]="['/skills/certification']">
      Certification
    </button>
    <button
      *ngIf="canEducation"
      type="button"
      class="tab-label"
      routerLinkActive="active"
      [routerLink]="['/skills/education']">
      Education
    </button>

    

  </div>

  <!-- Child Component Loads Here -->
  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
