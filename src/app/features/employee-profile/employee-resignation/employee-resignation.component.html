<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Resignation</h2>

  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Employee Profile</a> &gt;
    <span>Employee Resignation</span>
  </nav>
</div>

<div class="tab-container">

  <div class="tab-header">

    <button
      *ngIf="canViewResignation"
      type="button"
      class="tab-label"
      routerLink="/resignation/details"
      routerLinkActive="active">
      Employee Resignation Details
    </button>

    <button
      *ngIf="canViewApproval"
      type="button"
      class="tab-label"
      routerLink="/resignation/manager-approval"
      routerLinkActive="active">
      Manager Approval
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
