<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Employee Details</h2>

  <nav class="breadcrumb">
    <a routerLink="/dashboard">Home</a> &gt;
    <span>Employee Details</span>
  </nav>
</div>

<div class="tab-container">

  <div class="tab-header">

    <button
      *ngIf="canViewPersonal"
      type="button"
      class="tab-label"
      routerLink="/details/personal"
      routerLinkActive="active">
      Personal Details
    </button>

    <button
      *ngIf="canViewFamily"
      type="button"
      class="tab-label"
      routerLink="/details/family"
      routerLinkActive="active">
      Family Details
    </button>

    <button
      *ngIf="canViewEmergency"
      type="button"
      class="tab-label"
      routerLink="/details/emergency"
      routerLinkActive="active">
      Emergency Contact
    </button>

    <button
      *ngIf="canViewReference"
      type="button"
      class="tab-label"
      routerLink="/details/reference"
      routerLinkActive="active">
      References
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
