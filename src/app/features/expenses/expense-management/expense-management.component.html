<app-header></app-header>
<app-sidebar></app-sidebar>

<div class="dashboard-header">
  <h2 class="dashboard-title">Expense Management</h2>
  <nav class="breadcrumb">
    <a href="#">Home</a> &gt;
    <a href="#">Finance</a> &gt;
    <span>Expenses</span>
  </nav>
</div>

<div class="tab-container">

  <div class="tab-header">

    <button
      *ngIf="canCreateExpense"
      type="button"
      class="tab-label"
      routerLink="/expenses/create-expense"
      routerLinkActive="active">
      Create Expense
    </button>

    <button
      *ngIf="canViewAllExpense"
      type="button"
      class="tab-label"
      routerLink="/expenses/all-expenses"
      routerLinkActive="active">
      All Expenses
    </button>

    <button
      *ngIf="canApproveExpense"
      type="button"
      class="tab-label"
      routerLink="/expenses/approve-expenses"
      routerLinkActive="active">
      Approve Expenses
    </button>

  </div>

  <div class="tab-content">
    <router-outlet></router-outlet>
  </div>

</div>

<app-footer></app-footer>
